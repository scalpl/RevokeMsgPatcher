name: .Net Build

on:
  workflow_dispatch:
    inputs:
      Reason:
        description: 'Reasons for temporary build'
        required: true
        default: 'No reason. Just do it.'
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - .gitignore
      - .editorconfig
      - appveyor.yml

  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - .gitignore
      - .editorconfig
      - appveyor.yml

jobs:
  build:
    name: Build (${{ matrix.BUILD_CONFIGURATION }})
    runs-on: windows-2022
    strategy:
      matrix:
        BUILD_CONFIGURATION: [Debug, Release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: nuget restore

      - name: Install .NET Framework reference assemblies
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE '.ci\reference-assemblies\.NETFramework'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($framework in @('452', '472')) {
            nuget install "Microsoft.NETFramework.ReferenceAssemblies.net$framework" -Version 1.0.3 -OutputDirectory .ci -NonInteractive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item ".ci\Microsoft.NETFramework.ReferenceAssemblies.net$framework.1.0.3\build\.NETFramework\*" $destination -Recurse -Force
          }

      - name: Build Solution
        shell: pwsh
        run: |
          $referenceRoot = Join-Path $env:GITHUB_WORKSPACE '.ci\reference-assemblies'
          msbuild /m /p:Configuration=${{ matrix.BUILD_CONFIGURATION }} "/p:TargetFrameworkRootPath=$referenceRoot"

      - name: Regression tests
        if: matrix.BUILD_CONFIGURATION == 'Release'
        shell: pwsh
        run: .\Tests\Run.ps1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevokeMsgPatcher-${{ matrix.BUILD_CONFIGURATION }}
          path: |
            .\RevokeMsgPatcher\bin\${{ matrix.BUILD_CONFIGURATION }}\
            !.\RevokeMsgPatcher\bin\**\RevokeMsgPatcher.pdb
          if-no-files-found: error
